<div class="mx-auto max-w-2xl px-4 py-24 text-center sm:px-6">
  <p class="font-display text-6xl font-bold text-primary">404</p>

  <h1 class="mt-4 text-3xl font-bold tracking-tight" i18n="@@notFound.title">
    Cette page n'existe pas.
  </h1>

  <p class="mt-4 text-text-muted" i18n="@@notFound.lede">
    Le lien est peut-être obsolète, ou l'adresse a été mal saisie.
  </p>

  <div class="mt-8 flex flex-wrap justify-center gap-4">
    <a
      routerLink="/"
      class="rounded-sm bg-primary px-6 py-3 text-base font-semibold text-primary-contrast hover:bg-primary-hover"
      i18n="@@notFound.backHome"
    >
      Retour à l'accueil
    </a>
    <a
      routerLink="/start"
      class="rounded-sm border border-border-strong px-6 py-3 text-base font-semibold text-text-strong hover:bg-surface-muted"
      i18n="@@notFound.startProject"
    >
      Démarrer un projet
    </a>
  </div>
</div>
