<section class="portfolio" data-portfolio>
  <div class="container-wide">
    <div class="portfolio__tools">
      <app-select-buttons
        [options]="filters()"
        [label]="t('projects.filterLabel')"
        [(value)]="activeFilter"
      />
      <app-search-input
        class="portfolio__search"
        [label]="t('projects.searchLabel')"
        [placeholder]="t('projects.searchPlaceholder')"
        [clearLabel]="t('projects.clearSearch')"
        [(value)]="searchQuery"
      />
    </div>

    <!--
      The grid changes without any focus moving, so a screen-reader user gets no
      feedback at all from the click. This announces the new count for them; it is
      `sr-only` because the sighted equivalent is the grid itself.
    -->
    <p class="sr-only" role="status" aria-live="polite">
      {{ t('projects.countLabel', { count: visible().length }) }}
    </p>

    @if (visible().length > 0) {
      <!--
        `track project.slug` matters beyond convention — filtering rebuilds the
        list, and the slug is what lets Angular keep the surviving cards rather
        than re-creating every one of them.
      -->
      <ul class="portfolio__grid">
        @for (project of visible(); track project.slug) {
          <li><app-project-card [project]="project" /></li>
        }
      </ul>
    } @else {
      <div class="portfolio__empty">
        <p class="text-text-muted">
          {{ t(searchQuery().trim() ? 'projects.searchEmpty' : 'projects.empty') }}
        </p>
        <button appButton="outline" size="sm" type="button" (click)="resetFilters()" class="mt-5">
          {{ t('projects.emptyAction') }}
        </button>
      </div>
    }
  </div>
</section>
