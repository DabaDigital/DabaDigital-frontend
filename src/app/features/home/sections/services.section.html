<section
  id="services"
  appSectionSpy
  class="services"
  [class.section]="featured()"
  [class.section-rule]="featured()"
>
  <div class="container-wide">
    @if (featured()) {
      <div class="services__head">
        <div>
          <p class="section-label" data-reveal>
            <span class="section-label__slashes" aria-hidden="true">//</span>
            {{ t('services.eyebrow') }}
          </p>
          <h2 class="section-title services__title" data-reveal>{{ t('services.title') }}</h2>
        </div>
        <div data-reveal>
          <a appButton="outline" size="sm" routerLink="/services">
            {{ t('services.exploreAll') }}
            <app-icon name="arrow-right" class="cta-arrow" />
          </a>
        </div>
      </div>
    }

    <ul class="services__grid">
      @for (service of shown(); track service.id) {
        <li data-card>
          <app-service-card
            [id]="service.id"
            [icon]="service.icon"
            [title]="content.text(service.title)"
            [description]="content.text(service.description)"
          />
        </li>
      }
    </ul>
  </div>
</section>
