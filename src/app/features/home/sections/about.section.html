<section id="about" appSectionSpy class="section section-rule">
  <!--
    The markup follows the phone's reading order — the statement, the picture,
    the figures — and the wide grid lifts the picture into a column of its own
    beside the other two.
  -->
  <div class="about container-wide">
    <div class="about__intro">
      <p class="section-label" data-reveal>
        <span class="section-label__slashes" aria-hidden="true">//</span>
        {{ t('about.eyebrow') }}
      </p>
      <h2 class="section-title about__title" data-reveal>{{ t('about.title') }}</h2>
      <p class="section-lede about__lede" data-reveal>{{ t('about.lede') }}</p>
    </div>

    <figure class="about__frame" data-shutter>
      @if (image) {
        <img
          [src]="image"
          [alt]="t('about.imageAlt')"
          loading="lazy"
          decoding="async"
          class="about__image"
        />
      } @else {
        <app-office-art class="about__image" />
      }
      <figcaption class="about__caption">
        <span>{{ t('about.caption') }}</span>
        <span class="about__caption-rule" aria-hidden="true"></span>
      </figcaption>
    </figure>

    <!--
      A description list: each figure is a value described by its label, and
      a screen reader reads them as a pair. The term precedes the description
      in the DOM; `column-reverse` puts the number on top visually.
    -->
    <dl class="about__stats" [attr.aria-label]="t('about.statsLabel')" data-reveal>
      @for (stat of stats; track stat.valueKey) {
        <div class="about__stat">
          <dt class="about__stat-label">{{ t(stat.labelKey) }}</dt>
          <dd class="about__stat-value">{{ t(stat.valueKey) }}</dd>
        </div>
      }
    </dl>
  </div>
</section>
