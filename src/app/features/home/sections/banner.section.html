<!--
  The opening. The night scene fills the section behind the copy on a wide
  screen; the stacked phone and tablet layout leaves it out. `data-hero` marks
  what the entrance timeline animates — none of it changes the static design.
-->
<section id="banner" appSectionSpy class="hero">
  <div class="grain" aria-hidden="true"></div>

  <div class="hero__body container-wide">
    <div class="hero__copy">
      <p class="section-label" data-hero="eyebrow">
        <span class="section-label__slashes" aria-hidden="true">//</span>
        {{ t('banner.eyebrow') }}
      </p>

      <!--
        Three beats on three lines. The spaces between them are real text nodes,
        so the heading reads "Build. Launch. Grow." as one sentence; the caret
        after the last beat is ornament.
      -->
      <h1 class="hero-title">
        <span class="hero-title__line"
          ><span class="hero-title__text" data-hero-line>{{ t('banner.title1') }}</span></span
        >{{ ' '
        }}<span class="hero-title__line"
          ><span class="hero-title__text hero-title__text--silver" data-hero-line>{{
            t('banner.title2')
          }}</span></span
        >{{ ' '
        }}<span class="hero-title__line"
          ><span class="hero-title__text" data-hero-line
            >{{ t('banner.title3') }}<span class="hero-caret" aria-hidden="true"></span></span
        ></span>
      </h1>

      <p class="hero__lede" data-hero="fade">{{ t('banner.lede') }}</p>

      <div class="hero__actions" data-hero="fade">
        <a appButton="inverse" routerLink="/" fragment="contact" class="hero__cta">
          <span class="cta-orb" aria-hidden="true">
            <app-icon name="arrow-right" class="cta-arrow" />
          </span>
          {{ t('banner.ctaPrimary') }}
        </a>

        <a routerLink="/" fragment="projects" class="hero__secondary group">
          <span class="hero__secondary-orb" aria-hidden="true">
            <app-icon name="arrow-down" class="size-4" />
          </span>
          {{ t('banner.ctaSecondary') }}
        </a>
      </div>
    </div>
  </div>

  <app-night-visual class="hero__visual" variant="hero" data-hero="visual" />

  <div class="hero__foot container-wide" data-hero="fade">
    <p class="hero__scroll" aria-hidden="true">
      <span class="hero__scroll-line"></span>
      {{ t('banner.scroll') }}
    </p>
  </div>

  <!--
    How far down the page the visitor is, as a chapter count: the six content
    sections, the closing call to action being an interlude. Ornament.
  -->
  <div class="hero__rail" aria-hidden="true" data-hero="fade">
    <span>01</span>
    <span class="hero__rail-track"><span class="hero__rail-dot" data-rail-dot></span></span>
    <span>06</span>
  </div>
</section>
