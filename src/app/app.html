<a class="skip-link" href="#main-content">{{ i18n.t('nav.skipToContent') }}</a>

<!--
  The public site is designed at night: `.night` pins everything outside the
  admin to the dark tokens, whatever the theme preference (see tokens.scss).
-->
<div class="flex min-h-dvh flex-col" [class.night]="!isAdmin()">
  @if (!isAdmin()) {
    <app-site-header />
  }

  <main id="main-content" tabindex="-1" class="flex-1 focus:outline-none">
    <router-outlet />
  </main>

  <!-- Not before the first page has rendered — see `routed` in app.ts. -->
  @if (!isAdmin() && routed()) {
    <app-site-footer />
  }
</div>
