<!--
  `border-transparent` at rest, filled in by the scroll-driven `header-lift`
  animation in the component styles. The border box is present either way, so the
  transition costs no layout shift.
-->
<header
  class="site-header sticky top-0 z-50 border-b border-transparent bg-surface-page/80 backdrop-blur-md"
>
  <div class="mx-auto flex h-16 max-w-6xl items-center gap-2 px-4 sm:gap-3 sm:px-6">
    <!--
      The mark is a picture of the company name, so it stays `aria-hidden` inside
      the component and the link carries the name — otherwise the home link would
      announce as "link" with nothing else.
    -->
    <a
      routerLink="/"
      (click)="closeMenu()"
      class="flex items-center rounded-sm text-text-strong"
      [attr.aria-label]="t('nav.homeLabel')"
    >
      <app-logo class="h-7 sm:h-8" />
    </a>

    <nav
      class="ms-auto hidden items-center gap-1 lg:flex"
      [attr.aria-label]="t('nav.primaryLabel')"
    >
      @for (link of links(); track link.id) {
        <!--
          `aria-current="location"`, not `"page"`: these are positions within the
          current page, and the page itself has not changed.
        -->
        <a
          routerLink="/"
          [fragment]="link.id"
          [attr.aria-current]="activeSection() === link.id ? 'location' : null"
          class="rounded-sm px-3 py-2 text-sm font-medium text-text-muted transition-colors duration-(--duration-fast) ease-standard hover:text-text-strong aria-[current]:bg-surface-muted aria-[current]:text-text-strong"
        >
          {{ link.label }}
        </a>
      }
    </nav>

    <div class="ms-auto flex items-center gap-2 lg:ms-2">
      <app-theme-toggle />
      <app-language-menu />

      <a appButton size="sm" routerLink="/" fragment="contact" class="hidden lg:inline-flex">
        {{ t('nav.cta') }}
      </a>

      <!-- 40px square: the touch-target floor, and it matches the two controls beside it. -->
      <button
        appButton="secondary"
        size="icon"
        type="button"
        (click)="toggleMenu()"
        [attr.aria-expanded]="menuOpen()"
        [attr.aria-label]="menuOpen() ? t('nav.closeMenu') : t('nav.openMenu')"
        aria-controls="mobile-nav"
        class="lg:hidden"
      >
        <app-icon [name]="menuOpen() ? 'close' : 'menu'" class="size-[1.15rem]" />
      </button>
    </div>
  </div>

  @if (menuOpen()) {
    <nav
      id="mobile-nav"
      class="border-t border-border-subtle bg-surface-page px-4 pb-4 lg:hidden"
      [attr.aria-label]="t('nav.mobileLabel')"
    >
      <ul class="flex flex-col gap-1 py-2">
        @for (link of links(); track link.id) {
          <li>
            <a
              routerLink="/"
              [fragment]="link.id"
              (click)="closeMenu()"
              [attr.aria-current]="activeSection() === link.id ? 'location' : null"
              class="flex min-h-11 items-center rounded-sm px-3 text-base font-medium text-text-muted aria-[current]:bg-surface-muted aria-[current]:text-text-strong"
            >
              {{ link.label }}
            </a>
          </li>
        }
      </ul>
      <a appButton routerLink="/" fragment="contact" (click)="closeMenu()" class="w-full">
        {{ t('nav.cta') }}
      </a>
    </nav>
  }
</header>
