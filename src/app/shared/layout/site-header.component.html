<!-- Leaves the viewport once the page scrolls; see `scrolled` in the component. -->
<div #sentinel class="site-header__sentinel" aria-hidden="true"></div>

<header class="site-header" [class.is-scrolled]="scrolled()">
  <div class="site-header__inner container-wide">
    <!--
      The mark is a picture of the company name, so it stays `aria-hidden` inside
      the component and the link carries the name.
    -->
    <a
      routerLink="/"
      fragment="banner"
      class="site-header__brand"
      [attr.aria-label]="t('nav.homeLabel')"
    >
      <app-logo class="h-8 lg:h-9" />
    </a>

    <nav class="site-nav" [attr.aria-label]="t('nav.primaryLabel')">
      <ul class="site-nav__list">
        @for (link of links(); track link.id) {
          <li>
            <!--
              `aria-current="location"`, not `"page"`: these are positions within
              the current page, and the page itself has not changed.
            -->
            <a
              routerLink="/"
              [fragment]="link.id"
              class="site-nav__link"
              [attr.aria-current]="activeSection() === link.id ? 'location' : null"
            >
              {{ link.label }}
            </a>
          </li>
        }
      </ul>
    </nav>

    <div class="site-header__actions">
      <app-language-menu appearance="ghost" class="site-header__lang" />

      <a appButton="outline" size="sm" routerLink="/" fragment="contact" class="site-header__cta">
        {{ t('nav.cta') }}
        <app-icon name="arrow-right" class="cta-arrow" />
      </a>

      <button
        type="button"
        class="site-header__menu"
        (click)="openMenu()"
        aria-haspopup="dialog"
        aria-controls="site-menu"
        [attr.aria-expanded]="menuOpen()"
        [attr.aria-label]="t('nav.openMenu')"
      >
        <app-icon name="menu" class="size-4.5" />
      </button>
    </div>
  </div>
</header>

<dialog
  #menu
  id="site-menu"
  class="site-menu"
  [attr.aria-label]="t('nav.mobileLabel')"
  (close)="menuOpen.set(false)"
>
  <div class="site-menu__inner container-wide">
    <div class="site-menu__top">
      <app-logo class="h-8 lg:h-9" />
      <button
        type="button"
        class="site-header__menu"
        (click)="closeMenu()"
        [attr.aria-label]="t('nav.closeMenu')"
      >
        <app-icon name="close" class="size-4.5" />
      </button>
    </div>

    <nav class="site-menu__nav" [attr.aria-label]="t('nav.mobileLabel')">
      <ul class="site-menu__links">
        @for (link of links(); track link.id; let i = $index) {
          <li [style.--i]="i">
            <a
              routerLink="/"
              [fragment]="link.id"
              (click)="closeMenu()"
              class="site-menu__link"
              [attr.aria-current]="activeSection() === link.id ? 'location' : null"
            >
              <span class="site-menu__index" aria-hidden="true">{{ index(i) }}</span>
              <span>{{ link.label }}</span>
            </a>
          </li>
        }
      </ul>
    </nav>

    <div class="site-menu__foot">
      <div class="site-menu__langs" role="group" [attr.aria-label]="t('lang.choose')">
        @for (locale of i18n.available; track locale.code) {
          <button
            type="button"
            class="site-menu__lang"
            [attr.lang]="locale.code"
            [attr.aria-pressed]="locale.code === i18n.locale()"
            (click)="i18n.setLocale(locale.code)"
          >
            {{ locale.nativeName }}
          </button>
        }
      </div>

      <a appButton="inverse" routerLink="/" fragment="contact" (click)="closeMenu()">
        {{ t('nav.cta') }}
        <app-icon name="arrow-right" class="cta-arrow" />
      </a>
    </div>
  </div>
</dialog>
