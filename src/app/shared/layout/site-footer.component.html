<footer class="border-t border-white/10 bg-[#030712] text-slate-400">
  <div class="mx-auto max-w-7xl px-4 py-12 sm:px-6 lg:py-16">
    <div class="flex flex-col gap-8 lg:flex-row lg:items-center lg:justify-between">
      <!-- Left: Logo & Studio description -->
      <div class="flex flex-col gap-2.5 max-w-sm">
        <div class="flex items-center gap-3">
          <app-logo class="h-7 text-white" />
          <span class="sr-only">DabaDigital</span>
        </div>
        <p class="text-xs text-slate-400 leading-relaxed">
          Moroccan digital studio — websites, applications and custom integrations.
        </p>
      </div>

      <!-- Middle: Navigation links -->
      <nav class="flex flex-wrap items-center gap-6 text-sm" [attr.aria-label]="t('footer.navLabel')">
        @for (section of sections(); track section.id) {
          <a
            routerLink="/"
            [fragment]="section.id"
            class="text-sm font-medium text-slate-400 transition-colors hover:text-white"
          >
            {{ section.label }}
          </a>
        }
      </nav>

      <!-- Right: Location & Time in Morocco -->
      <div class="flex flex-col gap-2 text-xs text-slate-400">
        <div class="flex items-center gap-2">
          <app-icon name="map-pin" class="size-3.5 text-sky-400" />
          <span>Casablanca, Morocco</span>
        </div>
        <div class="flex items-center gap-2">
          <app-icon name="clock" class="size-3.5 text-sky-400" />
          <span>{{ localTime() }}</span>
        </div>
      </div>
    </div>

    <!-- Bottom sub-bar -->
    <div class="mt-12 flex flex-col items-center justify-between gap-4 border-t border-white/5 pt-6 text-xs sm:flex-row text-slate-500">
      <p>© {{ year() }} DabaDigital. All rights reserved.</p>
      <p class="flex items-center gap-1.5">
        Built with passion
      </p>
    </div>
  </div>
</footer>
