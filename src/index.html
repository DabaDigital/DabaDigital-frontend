<!doctype html>
<!--
  Arabic is the primary locale, so it is what the document declares before any
  script runs. The inline bootstrap at the end of <head> rewrites `lang`, `dir`
  and `data-theme` from the visitor's stored preferences.
-->
<html lang="ar" dir="rtl" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <title>Daba Digital — Technical Digital Agency</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      The defaults a crawler sees before any script runs. `HomePage` rewrites
      the title and the descriptions in the visitor's language.
    -->
    <meta
      name="description"
      content="Daba Digital builds high-performance websites, digital products, mobile applications and intelligent digital experiences."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Daba Digital" />
    <meta property="og:title" content="Daba Digital — Technical Digital Agency" />
    <meta
      property="og:description"
      content="Daba Digital builds high-performance websites, digital products, mobile applications and intelligent digital experiences."
    />
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Daba Digital — Technical Digital Agency" />
    <meta
      name="twitter:description"
      content="Daba Digital builds high-performance websites, digital products, mobile applications and intelligent digital experiences."
    />
    <meta name="twitter:image" content="/og-image.jpg" />

    <!-- Brand icons derived from the DabaDigital wordmark: the D alone, since the
         full lockup is unreadable at 32px. favicon.ico stays for the browsers
         that request it by convention. -->
    <link rel="icon" type="image/x-icon" href="favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" href="icon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <!-- Kept in step with `--surface-page` by `core/theme/theme.service.ts`. -->
    <meta name="theme-color" content="#020406" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Three families in one request. Google Fonts splits its output by
      `unicode-range`, so a French visitor never downloads the Arabic binaries and
      an Arabic visitor never downloads the Latin face — only the one CSS file is
      shared. Geist is variable: one file per subset covers every weight.
      `display=swap` keeps text visible while they load.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Noto+Sans+Arabic:wght@400;500;600&family=Cairo:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <!--
      Theme and locale, applied before the first paint.

      This duplicates the resolution in `core/theme/theme.service.ts` and
      `core/i18n/i18n.service.ts` on purpose: Angular boots after the browser has
      already painted, so without this an Arabic visitor sees one frame of
      left-to-right layout. The storage keys are the contract between the three
      — change them together.

      The public site is dark whatever the theme says (see `.night` in
      tokens.scss); the theme only matters in the admin.

      Everything is inside try/catch: storage throws outright in some privacy
      modes, and a theme preference is not worth a blank page.
    -->
    <script>
      (function () {
        var root = document.documentElement;

        try {
          var theme = localStorage.getItem('dabadigital.theme');
          if (theme !== 'light' && theme !== 'dark') {
            theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          root.setAttribute('data-theme', theme);
        } catch (e) {
          /* Keep the `data-theme="dark"` already on <html>. */
        }

        try {
          var locales = { ar: 'rtl', fr: 'ltr', en: 'ltr' };
          var locale = localStorage.getItem('dabadigital.locale');
          if (!locales[locale]) {
            locale = (navigator.language || 'ar').split('-')[0];
          }
          if (!locales[locale]) {
            locale = 'ar';
          }
          root.setAttribute('lang', locale);
          root.setAttribute('dir', locales[locale]);
        } catch (e) {
          /* Keep the `lang="ar" dir="rtl"` already on <html>. */
        }
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
