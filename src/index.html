<!doctype html>
<!--
  Arabic is the primary locale, so it is what the document declares before any
  script runs. The inline bootstrap at the end of <head> rewrites `lang`, `dir`
  and `data-theme` from the visitor's stored preferences.
-->
<html lang="ar" dir="rtl" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <title>DabaDigital — Build. Launch. Grow.</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="DabaDigital — studio digital marocain : sites, applications web et intégrations sur mesure."
    />
    <!-- Brand icons derived from the DabaDigital wordmark: the D alone, since the
         full lockup is unreadable at 32px. favicon.ico stays for the browsers
         that request it by convention. -->
    <link rel="icon" type="image/x-icon" href="favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" href="icon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <!-- Kept in step with `--surface-page` by `core/theme/theme.service.ts`. -->
    <meta name="theme-color" content="#f7f8fa" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Four families in one request. Google Fonts splits its output by
      `unicode-range`, so a French visitor never downloads the Arabic binaries and
      an Arabic visitor never downloads the Latin display face — only the one CSS
      file is shared. `display=swap` keeps text visible while they load.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&family=Noto+Sans+Arabic:wght@400;500;600&family=Cairo:wght@600;700&display=swap"
      rel="stylesheet"
    />

    <!--
      Theme and locale, applied before the first paint.

      This duplicates the resolution in `core/theme/theme.service.ts` and
      `core/i18n/i18n.service.ts` on purpose: Angular boots after the browser has
      already painted, so without this an Arabic visitor sees one frame of
      left-to-right layout, and a dark-mode visitor one frame of white. The
      storage keys are the contract between the three — change them together.

      Everything is inside try/catch: storage throws outright in some privacy
      modes, and a theme preference is not worth a blank page.
    -->
    <script>
      (function () {
        var root = document.documentElement;

        try {
          var theme = localStorage.getItem('dabadigital.theme');
          if (theme !== 'light' && theme !== 'dark') {
            theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          root.setAttribute('data-theme', theme);

          var chrome = document.querySelector('meta[name="theme-color"]');
          if (chrome) {
            chrome.setAttribute('content', theme === 'dark' ? '#0d1117' : '#f7f8fa');
          }
        } catch (e) {
          /* Keep the `data-theme="light"` already on <html>. */
        }

        try {
          var locales = { ar: 'rtl', fr: 'ltr', en: 'ltr' };
          var locale = localStorage.getItem('dabadigital.locale');
          if (!locales[locale]) {
            locale = (navigator.language || 'ar').split('-')[0];
          }
          if (!locales[locale]) {
            locale = 'ar';
          }
          root.setAttribute('lang', locale);
          root.setAttribute('dir', locales[locale]);
        } catch (e) {
          /* Keep the `lang="ar" dir="rtl"` already on <html>. */
        }
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
